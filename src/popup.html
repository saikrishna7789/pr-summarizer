<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Summarizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      width: 300px;
      background: #ffffff;
      color: #1f2328;
    }

    .header {
      padding: 14px 16px 12px;
      background: #f6f8fa;
      border-bottom: 1.5px solid #d0d7de;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      color: #6e40c9;
      font-size: 16px;
    }

    h1 {
      font-size: 14px;
      font-weight: 700;
      color: #1f2328;
    }

    .body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #57606a;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      color: #1f2328;
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #6e40c9;
      box-shadow: 0 0 0 3px rgba(110, 64, 201, 0.12);
    }

    .hint {
      font-size: 11px;
      color: #57606a;
      margin-top: 4px;
      line-height: 1.45;
    }

    .hint a {
      color: #6e40c9;
      text-decoration: none;
    }

    .hint a:hover { text-decoration: underline; }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: background 0.15s;
    }

    .btn-primary {
      background: #6e40c9;
      color: #fff;
      border-color: #6e40c9;
    }

    .btn-primary:hover { background: #5a32a3; }

    .btn-secondary {
      background: #f6f8fa;
      color: #1f2328;
      border-color: #d0d7de;
    }

    .btn-secondary:hover { background: #eaeef2; }

    .status {
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      display: none;
    }

    .status.success {
      background: #dafbe1;
      color: #116329;
      display: block;
    }

    .status.error {
      background: #ffebe9;
      color: #b91c1c;
      display: block;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #f0f1f2;
      font-size: 11px;
      color: #8c959f;
      text-align: center;
    }

    .footer a {
      color: #6e40c9;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">◆</span>
    <h1>PR Summarizer</h1>
  </div>

  <div class="body">
    <div>
      <label for="provider">Provider</label>
      <select id="provider">
        <option value="ollama">Ollama (local)</option>
        <option value="gemini">Gemini (Google)</option>
        <option value="claude">Claude (Anthropic)</option>
      </select>

      <div id="ollama-settings" style="margin-top:10px">
        <label for="ollama-url">Ollama URL</label>
        <input type="text" id="ollama-url" placeholder="http://localhost:11434" />
        <label for="ollama-model" style="margin-top:6px">Ollama Model</label>
        <input type="text" id="ollama-model" placeholder="model name (e.g. mixtral-8x7b)" />
        <p class="hint">Local Ollama instance (no key required).</p>
      </div>

      <div id="gemini-settings" style="margin-top:10px; display:none">
        <label for="google-key">Google API Key</label>
        <input type="password" id="google-key" placeholder="AIza..." autocomplete="off" spellcheck="false" />
        <p class="hint">Create an API key in Google Cloud Console and enable the Generative Language API.</p>
      </div>

      <div id="claude-settings" style="margin-top:10px; display:none">
        <label for="anthropic-key">Anthropic API Key</label>
        <input type="password" id="anthropic-key" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
        <p class="hint">Paste your Anthropic key if you want to use Claude.</p>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div class="btn-row">
      <button class="btn-primary" id="save-btn">Save key</button>
      <button class="btn-secondary" id="clear-btn">Clear</button>
    </div>
  </div>

  <div class="footer">
    Works on GitHub PRs &amp; GitLab MRs
  </div>

  <script src="popup.js"></script>
</body>
</html>
